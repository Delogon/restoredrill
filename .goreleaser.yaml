# GoReleaser v2 — linux/amd64 + linux/arm64 binaries, cosign signatures, SBOMs
# and a multi-arch Docker image bundling restic and Borg.
#
# Release flow (see .github/workflows/release.yml):
#   git tag v0.1.0 && git push origin v0.1.0
#
# Local dry run (no publish, no signing):
#   goreleaser release --snapshot --clean
#
# The GitHub owner is a working title and may change before the first release.
version: 2

project_name: restoredrill

before:
  hooks:
    - go mod verify

builds:
  - id: restoredrill
    main: ./cmd/restoredrill
    binary: restoredrill
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}

archives:
  - id: default
    ids:
      - restoredrill
    formats:
      - tar.gz
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - docs/*
      - examples/*
      - recipes/*.yaml

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_checksums.txt'

# Keyless cosign signature over the checksum file (CI provides the OIDC token).
signs:
  - cmd: cosign
    artifacts: checksum
    signature: '${artifact}.sig'
    certificate: '${artifact}.pem'
    args:
      - sign-blob
      - '--yes'
      - '--output-signature=${signature}'
      - '--output-certificate=${certificate}'
      - '${artifact}'

# One SBOM per archive (requires syft on the release runner).
sboms:
  - artifacts: archive

# Per-arch images built from the GoReleaser binary, then joined into manifests.
dockers:
  - id: amd64
    ids:
      - restoredrill
    image_templates:
      - 'ghcr.io/restoredrill/restoredrill:{{ .Version }}-amd64'
      - 'ghcr.io/restoredrill/restoredrill:latest-amd64'
    dockerfile: Dockerfile.goreleaser
    use: buildx
    goarch: amd64
    build_flag_templates:
      - '--platform=linux/amd64'
      - '--label=org.opencontainers.image.title={{ .ProjectName }}'
      - '--label=org.opencontainers.image.version={{ .Version }}'
      - '--label=org.opencontainers.image.revision={{ .FullCommit }}'
      - '--label=org.opencontainers.image.source={{ .GitURL }}'
      - '--label=org.opencontainers.image.licenses=Apache-2.0'
  - id: arm64
    ids:
      - restoredrill
    image_templates:
      - 'ghcr.io/restoredrill/restoredrill:{{ .Version }}-arm64'
      - 'ghcr.io/restoredrill/restoredrill:latest-arm64'
    dockerfile: Dockerfile.goreleaser
    use: buildx
    goarch: arm64
    build_flag_templates:
      - '--platform=linux/arm64'
      - '--label=org.opencontainers.image.title={{ .ProjectName }}'
      - '--label=org.opencontainers.image.version={{ .Version }}'
      - '--label=org.opencontainers.image.revision={{ .FullCommit }}'
      - '--label=org.opencontainers.image.source={{ .GitURL }}'
      - '--label=org.opencontainers.image.licenses=Apache-2.0'

docker_manifests:
  - name_template: 'ghcr.io/restoredrill/restoredrill:{{ .Version }}'
    image_templates:
      - 'ghcr.io/restoredrill/restoredrill:{{ .Version }}-amd64'
      - 'ghcr.io/restoredrill/restoredrill:{{ .Version }}-arm64'
  - name_template: 'ghcr.io/restoredrill/restoredrill:latest'
    image_templates:
      - 'ghcr.io/restoredrill/restoredrill:latest-amd64'
      - 'ghcr.io/restoredrill/restoredrill:latest-arm64'

# Sign the published manifests (keyless, same OIDC token).
docker_signs:
  - cmd: cosign
    artifacts: manifests
    args:
      - sign
      - '--yes'
      - '${artifact}'

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: restoredrill
    name: restoredrill
  name_template: '{{ .Tag }}'